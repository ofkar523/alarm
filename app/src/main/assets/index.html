<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>교대근무 알람</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#2563eb; --accent-soft:#dbeafe; --danger:#dc2626; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.45}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font:inherit;color:inherit}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:5;background:#1e293b;color:#fff;padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
  header .sub{font-size:13px;opacity:.75}
  main{flex:1;padding:16px 14px 96px}
  nav#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
  nav#tabs button{flex:1;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  nav#tabs button .ic{font-size:20px;line-height:1}
  nav#tabs button.on{color:var(--accent);font-weight:700}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  h2{font-size:18px;margin:0 0 6px;letter-spacing:-.3px}
  h3{font-size:15px;margin:0 0 8px}
  .muted{color:var(--muted)} .small{font-size:13px}
  .row{display:flex;align-items:center;gap:8px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .primary,.ghost,.danger{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
  .primary{background:var(--accent);color:#fff}
  .primary:disabled{background:#94a3b8}
  .ghost{background:#fff;border:1px solid var(--line)}
  .danger{background:#fff;color:var(--danger);border:1px solid #fecaca}
  .btns{display:flex;gap:10px} .btns>*{flex:1}
  .small-btn{white-space:nowrap;flex:none;padding:7px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
  .link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
  .big-input{width:100%;font-size:22px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;outline:none;letter-spacing:4px;margin:10px 0}
  .big-input:focus{border-color:var(--accent)}
  .text-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
  .text-input:focus{border-color:var(--accent)}
  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps i{flex:1;height:5px;border-radius:3px;background:#cbd5e1}
  .steps i.on{background:var(--accent)}
  .chip{display:inline-flex;align-items:center;justify-content:center;color:#fff;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700;white-space:nowrap}
  .chip.mini{padding:1px 0;width:100%;font-size:11px;border-radius:5px}
  .chip.outline{background:#fff!important;border:2px dashed #cbd5e1;color:var(--muted)}
  .examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .examples button{padding:6px 10px;border-radius:999px;background:#f1f5f9;font-size:13px}
  .preview{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
  .preview .cell-p{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:12px 0}
  .opt{border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;background:#fff}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .nm{font-weight:800;font-size:17px}
  .opt .ds{font-size:12px;color:var(--muted);margin-top:4px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:17px}
  .icon{width:38px;height:38px;border-radius:10px;background:#f1f5f9;font-size:22px;line-height:1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:600}
  .sun{color:#ef4444!important} .sat{color:#3b82f6!important}
  .cell{min-width:0;overflow:hidden;min-height:64px;border-radius:10px;background:#f8fafc;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border:2px solid transparent}
  .cell[data-a]{cursor:pointer}
  .cell[data-a]:active{background:#e2e8f0}
  .cell .dn{font-size:13px;font-weight:600}
  .cell .chips{display:flex;flex-direction:column;gap:2px;width:100%}
  .cell.other{opacity:.38}
  .cell.today{border-color:var(--accent);background:#eff6ff}
  .cell.edited::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#f43f5e}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
  /* today card */
  .today-card{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff}
  .today-card .big{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .today-card .muted{color:#bfdbfe}
  .next-box{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;margin-top:12px}
  .banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  /* groups */
  .group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .group-head .name-in{flex:1;font-weight:700;font-size:16px;border:0;border-bottom:1px dashed transparent;padding:2px 0;outline:none;background:none;min-width:0}
  .group-head .name-in:focus{border-bottom-color:var(--accent)}
  .color-in{width:28px;height:28px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;flex:none}
  .color-in::-webkit-color-swatch-wrapper{padding:0}.color-in::-webkit-color-swatch{border:0;border-radius:50%}
  .time-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .time-row input[type=time],.time-row .tin{font-size:22px;font-weight:700;border:0;background:none;outline:none;flex:1;min-width:0}
  .time-row.off input[type=time],.time-row.off .tin{color:#cbd5e1}
  .g-row{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;text-align:left}
  .g-row .g-name{flex:1;font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-row .chev{color:#94a3b8;font-size:20px;width:16px;text-align:center}
  .badge{white-space:nowrap;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .badge.off{background:#f1f5f9;color:#94a3b8}
  .badge.none{background:#fffbeb;color:#b45309}
  .mv{width:36px;height:34px;border-radius:10px;background:#f1f5f9;color:#475569;font-size:13px}
  .mv:disabled{opacity:.3;cursor:default}
  .mv:active:not(:disabled){background:#e2e8f0}
  .del{width:32px;height:32px;border-radius:8px;color:#94a3b8;font-size:18px}
  .switch{position:relative;width:46px;height:28px;flex:none}
  .switch input{display:none}
  .switch span{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.2s}
  .switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked+span{background:var(--accent)}
  .switch input:checked+span::after{transform:translateX(18px)}
  .group-card.flash{animation:flash 1.6s ease}
  @keyframes flash{0%,40%{box-shadow:0 0 0 3px #f43f5e}100%{box-shadow:0 1px 2px rgba(15,23,42,.05)}}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .list-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
  .list-row:first-of-type{border-top:0}
  .up-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .up-item:first-child{border-top:0}
  .up-item .t{font-size:19px;font-weight:800;width:62px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.5}}
  .sel-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .sel-grid button{padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-weight:700;display:flex;align-items:center;gap:6px;background:#fff}
  .sel-grid button.on{color:#fff}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .swatches button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .swatches button.on{box-shadow:0 0 0 2px var(--ink)}
  .hidden{display:none!important}
  .memo-mini{width:100%;font-size:10px;line-height:1.25;color:#475569;background:#fef9c3;border-radius:4px;padding:1px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .memo-in{resize:vertical;min-height:70px;font-size:15px;line-height:1.45}
  .today-memo{margin-top:10px;background:rgba(255,255,255,.14);border-radius:12px;padding:9px 12px;font-size:14px;white-space:pre-wrap;cursor:pointer}
  .snd-sel{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:9px 6px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px}
  .seg button small{font-weight:400;font-size:11px;color:var(--muted)}
  .seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .keep-ask{background:#fff7e6;border:2px solid #fbbf24;padding:14px;margin:4px 0 10px;box-shadow:none}
  .upd-banner{display:flex;align-items:center;gap:10px;background:#eef2ff;border:1px solid #c7d2fe;color:#1e3a8a;border-radius:12px;padding:11px 12px;margin-bottom:14px;font-size:14px}
  .upd-bar{display:inline-block;width:90px;height:6px;background:#c7d2fe;border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
  .upd-bar i{display:block;height:100%;background:var(--accent)}
  .add-row{background:var(--accent-soft);border-radius:10px;padding:6px 10px;border-top:0;margin-top:6px}
  .add-row .tin{color:var(--accent)}
  .add-row .tin::placeholder{color:#93c5fd}
  .rules{margin-top:10px;display:grid;gap:8px}
  .rule{background:var(--bg);border-radius:12px;padding:10px 10px 10px 12px;display:grid;gap:8px}
  .rule-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
  .rule-line .snd-sel{flex:1 1 90px}
  .pills{display:flex;flex-wrap:wrap;gap:5px}
  .pills button{padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700}
  .pills button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pills button.sun:not(.on){color:#ef4444} .pills button.sat:not(.on){color:#3b82f6}
  .rule-mini{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:10px;font-weight:800;line-height:1.1;white-space:nowrap}
  .card > .time-row:first-child{border-top:0}
  .sec-h{margin:18px 4px 8px}
  .sec-h:first-child{margin-top:2px}
  .sec-h h3{margin:0;font-size:16px}
  .sec-h p{margin:2px 0 0}
  .o-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .o-label{border:0;background:none;outline:none;font:inherit;font-size:14px;font-weight:600;padding:2px 0;min-width:0;border-bottom:1px dashed transparent}
  .o-label:focus{border-bottom-color:var(--accent)}
  .add-row .o-label{background:#fff;border-radius:8px;padding:7px 9px}
  .tf{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .tf .tin{width:4.2em;flex:0 0 auto}
  .ampm{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .ampm button{padding:6px 9px;font-size:13px;font-weight:700;color:var(--muted);background:#fff}
  .ampm button.on{background:var(--ink);color:#fff}
  .time-row.off .ampm button.on{background:#cbd5e1}
  .add-row .tf{flex:0 1 auto}
  .g-row.sum{align-items:center;padding:12px 0}
  .g-sum{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .g-top{display:flex;align-items:center;gap:6px;font-size:14px}
  .g-times{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
  .g-mode{font-size:12.5px;color:var(--muted)}
  .sum-empty{font-size:14px;font-weight:600;color:#b45309}
  .group-card.dim .g-times{color:#94a3b8}
  .g-modeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:2px 0 6px}
  .g-modeline .g-mode{font-size:13.5px}
  .g-edit{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .g-edit .group-head{margin-bottom:6px}
  .edit-btn{flex:none;padding:6px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink)}
  .edit-btn.red{color:var(--danger);border-color:#fecaca}
  .tin[readonly]{cursor:default}
  .tin.editing{background:var(--accent-soft);border-radius:8px;padding:0 6px}
  .manage{background:var(--bg);box-shadow:none;padding:6px 12px;margin:0 0 10px}
  .m-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
  .m-row:first-child{border-top:0}
  .m-row.edit,.m-row.del-ask{display:block}
  button.g-modeline{width:100%;text-align:left;background:none;border-radius:8px}
  button.g-modeline:active{background:var(--bg)}
  .sheet.detail .dt-time{display:flex;justify-content:center;padding:16px 0 6px}
  .sheet.detail .dt-time .tin{font-size:40px;font-weight:800;width:3.4em;text-align:center;border:0;border-bottom:2px solid var(--line);outline:none;background:none}
  .sheet.detail .dt-time .tin:focus{border-bottom-color:var(--accent)}
  .sheet.detail .dt-time .ampm button{padding:10px 14px;font-size:15px}
  .dt-lab{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
  .red-txt{color:var(--danger)}
  .switch.sm{width:40px;height:24px}
  .switch.sm span::after{width:18px;height:18px}
  .switch.sm input:checked+span::after{transform:translateX(16px)}
  .g-off .g-name{color:var(--muted)}
  .once-mini{color:#475569}
  /* ---- 시간 줄: 휴대폰 폭에 맞춤 (겹치지 않게) ---- */
  .time-row{gap:8px}
  .tf{flex:0 0 auto;gap:6px}                     /* 숫자+오전/오후 묶음은 줄어들지 않게 */
  .tf .tin{width:3.3em}
  .time-row .tin{font-size:21px}
  .ampm button{padding:6px 8px;font-size:12.5px}
  .time-row .edit-btn{margin-left:auto;padding:6px 9px}   /* 수정·켜기·삭제는 오른쪽으로 */
  .time-row .switch{width:42px;height:26px}
  .time-row .switch span::after{width:20px;height:20px}
  .time-row .switch input:checked+span::after{transform:translateX(16px)}
  .time-row .del{width:26px}
  /* 일회성 알람: 이름·울리는 날은 아랫줄로 */
  .once-row{flex-wrap:wrap;row-gap:2px}
  .once-row .o-meta{order:9;flex:1 0 100%;flex-direction:row;align-items:baseline;gap:8px;padding-left:2px}
  .once-row .o-label{font-size:13.5px;padding:0}
  /* 추가 줄: [시각 오전/오후] … [추가][✕], 이름 칸은 아랫줄 */
  .add-row{flex-wrap:wrap;row-gap:8px}
  .add-row .small-btn{margin-left:auto}
  .once-add .o-label{order:9;flex:1 0 100% !important}
  @media (max-width:340px){   /* 아주 좁은 화면: ✕ 대신 '수정' 화면에서 삭제 */
    .time-row:not(.add-row) .del{display:none}
  }
  @media (max-width:360px){
    .time-row .tin{font-size:19px}
    .tf .tin{width:3.1em}
    .ampm button{padding:5px 6px;font-size:12px}
    .time-row .edit-btn{padding:5px 7px;font-size:12.5px}
  }
  .perm-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .perm-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;background:#fff7e6;color:#b45309;flex:none}
  .perm-item.ok .perm-ic{background:#d1fae5;color:#047857}
  .warn{color:#b45309;font-size:13px;background:#fffbeb;border-radius:10px;padding:8px 10px;margin-top:6px}
  /* ringing */
  .ring{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#0f172a,#1e3a8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
  .ring .rt{font-size:72px;font-weight:800;letter-spacing:-2px;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.55}}
  .ring .labels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .ring .chip{font-size:18px;padding:6px 14px}
  .ring button{width:100%;max-width:320px;padding:18px;border-radius:16px;font-size:18px;font-weight:800}
  .ring .stop{background:#fff;color:#0f172a}
  .ring .snooze{background:rgba(255,255,255,.15);color:#fff}
  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>교대근무 알람</h1>
      <div class="sub" id="hdrSub"></div>
    </div>
    <div style="text-align:right">
      <div id="clock" style="font-size:20px;font-weight:800"></div>
      <div class="sub" id="masterState"></div>
    </div>
  </header>
  <main id="view"></main>
  <nav id="tabs" class="hidden">
    <button data-a="tab" data-t="cal"><span class="ic">📅</span>캘린더</button>
    <button data-a="tab" data-t="alarm"><span class="ic">⏰</span>알람</button>
    <button data-a="tab" data-t="set"><span class="ic">⚙️</span>설정</button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div>
<div id="ring" class="ring hidden"></div>
<div id="toast"></div>

<script>
/* ===================== 기본 데이터 ===================== */
const STORE_KEY = 'shiftAlarm.v1';
/* ▼ 익명 사용 통계를 받을 주소. Vercel에 배포한 주소 뒤에 /api/collect 를 붙여 넣으세요.
     예: 'https://alarm-stats.vercel.app/api/collect'   (비워 두면 통계를 보내지 않아요) */
const STATS_URL = 'https://alarm-stats.vercel.app/api/collect';
/* 새 버전을 확인할 GitHub 저장소 (Releases 에 올린 .apk 를 확인) */
const UPDATE_REPO = 'ofkar523/alarm';
const DEFAULT_NAMES  = {주:'주간', 야:'야간', 휴:'휴일', 비:'비번', 오:'오후', 지:'지원', 당:'당직', 석:'석간', 새:'새벽', 교:'교육'};
const DEFAULT_COLORS = {주:'#f59e0b', 야:'#6366f1', 휴:'#10b981', 비:'#94a3b8', 오:'#0ea5e9', 지:'#ef4444', 당:'#ec4899', 교:'#8b5cf6'};
const DEFAULT_ALARMS = {}; // 알람 시간은 미리 채우지 않음 (사용자가 직접 추가)
const OFF_CHARS = ['휴','비'];
const PALETTE = ['#f59e0b','#6366f1','#10b981','#ef4444','#0ea5e9','#ec4899','#8b5cf6','#14b8a6','#f97316','#64748b','#84cc16','#a855f7'];
const WD = ['일','월','화','수','목','금','토'];

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm  = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => { const A=parseYmd(a), B=parseYmd(b);
  return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate()) - Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/864e5); };
const fmtDate = s => { const d = parseYmd(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const todayStr = () => ymd(new Date());
const addMin = (t, m) => { let [h,mm] = t.split(':').map(Number); let x = (h*60+mm+m) % 1440; if (x<0) x+=1440; return `${pad(Math.floor(x/60))}:${pad(x%60)}`; };

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2600); }

/* ===================== 상태 ===================== */
function fresh(){ return {setupDone:false, pattern:[], types:{}, anchorDate:null, anchorIndex:0, groups:{}, overrides:{}, enabled:true, sound:'beep', snoozes:[], lastFired:'', memos:{}}; }
function load(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){ return null; } }
const NATIVE = window.NativeAlarm || null; // 안드로이드 앱 안에서 실행 중이면 존재
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} scheduleNativeSoon(); }
/* 안드로이드: 앞으로 45일치 알람을 휴대폰 알람(AlarmManager)에 예약 */
let nativeTimer = null, nativeUntil = null;
function scheduleNativeSoon(){ if (!NATIVE) return; clearTimeout(nativeTimer); nativeTimer = setTimeout(scheduleNative, 300); }
function scheduleNative(){
  if (!NATIVE) return;
  const now = Date.now();
  const list = S.setupDone ? alarmEntries(45).filter(e => e.at > now + 1000).slice(0, 300)
    .map(e => ({at:e.at, time:fmt12(e.time), label:entryNames(e).join(' · '), sound:soundOf(e.ids)})) : [];
  nativeUntil = list.length ? list[list.length-1].at : null;
  try{ NATIVE.schedule(JSON.stringify(list)); }catch(e){}
}
let S = Object.assign(fresh(), load() || {});
if (!S.memos) S.memos = {};
if (!S.sound) S.sound = 'beep';
delete S.wake;
if (!Array.isArray(S.onceAlarms)) S.onceAlarms = [];
S.pattern.forEach(id => { if (S.types[id] && S.types[id].off && S.groups[id] && !S.groups[id].times.length) delete S.groups[id]; });
Object.keys(S.groups).forEach(id => {
  const g = S.groups[id];
  if (S.pattern.includes(id) || !S.types[id]) return;
  // 패턴에 없는 그룹은 모두 '특정 근무마다' 또는 '직접 정한 규칙'으로 울림
  //  - 캘린더에서 만든 근무(예: 지원): 기본은 그 근무가 있는 날
  //  - 알람 탭에서 만든 알람 전용 그룹: 고른 근무가 있는 날
  if (!g.mode || g.mode === 'calendar'){ g.mode = 'shift'; g.shifts = g.shifts || (S.types[id].alarmOnly ? [] : [id]); }
  if (g.mode === 'shift' && !g.shifts) g.shifts = S.types[id].alarmOnly ? [] : [id];
  if (g.mode === 'once'){
    // 예전 '한 번만' 알람 그룹 → 일회성 알람으로 옮김
    const name = S.types[id] ? S.types[id].name : '';
    g.times.forEach(x => S.onceAlarms.push({id: 'o' + Math.random().toString(36).slice(2, 9), t: x.t, on: !!(x.on && g.on), at: x.at, label: name}));
    delete S.groups[id]; delete S.types[id];
    Object.keys(S.overrides).forEach(d => { S.overrides[d] = S.overrides[d].filter(x => x !== id); });
  }
});
expireOnce();

/* ===================== 근무 계산 ===================== */
function baseShift(date){
  const L = S.pattern.length; if (!L || !S.anchorDate) return null;
  const i = (((S.anchorIndex + diffDays(S.anchorDate, date)) % L) + L) % L;
  return S.pattern[i];
}
function shiftsOn(date){
  if (S.overrides[date]) return S.overrides[date].filter(id => S.types[id] && !S.types[id].alarmOnly);
  const b = baseShift(date); return b && S.types[b] ? [b] : [];
}
function alarmsFor(ids){
  const map = {};
  ids.forEach(id => {
    const g = S.groups[id]; if (!g || !g.on) return;
    g.times.forEach(t => { if (t.on) (map[t.t] = map[t.t] || []).push(id); });
  });
  return Object.keys(map).sort().map(time => ({time, ids: map[time]}));
}
/* ---------- 일회성 알람 (기본 시계 앱처럼) ----------
   켠 시각 기준으로 '가장 가까운' 그 시각에 한 번 울리고, 울린 뒤에는 자동으로 꺼집니다. */
function isOnce(id){ return false; } // (예전 '한 번만' 그룹 방식은 일회성 알람으로 바뀜)
function atOf(date, time){ const [h,m] = time.split(':').map(Number), d = parseYmd(date); d.setHours(h, m, 0, 0); return d.getTime(); }
function nextAt(time){ const today = todayStr(); let at = atOf(today, time); if (at <= Date.now() + 15000) at = atOf(addDays(today, 1), time); return at; }
/* 일회성 알람 x = {t, on, label, date?, days?}
   - days(요일)가 있으면 그 요일마다 반복 (꺼지지 않음)
   - date(날짜)가 있으면 그날 한 번
   - 둘 다 없으면 가장 가까운 그 시각에 한 번 */
function isWeekly(x){ return !!(x.days && x.days.length); }
function arm(x){
  if (!x.on || isWeekly(x)){ delete x.at; return; }
  x.at = x.date ? atOf(x.date, x.t) : nextAt(x.t);
}
function oneShots(){
  return (S.onceAlarms || []).filter(x => x.on && x.at && !isWeekly(x)).map(x => ({at:x.at, time:x.t, ids:[], labels:[x.label || '일회성 알람']}));
}
/* 이 날 울리는 일회성 알람들 */
function onceOn(date){
  const wd = parseYmd(date).getDay();
  return (S.onceAlarms || []).filter(x => x.on && (isWeekly(x) ? x.days.includes(wd) : (x.at && ymd(new Date(x.at)) === date)));
}
/* 일회성 알람이 언제 울리는지 짧게: '매주 월·수' / '12/3(수) 울림' / '내일 울림' */
function onceWhen(x){
  if (isWeekly(x)) return '매주 ' + [1,2,3,4,5,6,0].filter(d => x.days.includes(d)).map(d => WD[d]).join('·');
  if (!x.on || !x.at) return x.date ? mdw(x.date) + ' · 꺼짐' : '꺼짐';
  const d = ymd(new Date(x.at)), k = diffDays(todayStr(), d);
  return (k >= 0 && k <= 2 ? dayWord(d) : mdw(d)) + ' 울림';
}
function mdw(d){ const x = parseYmd(d); return `${x.getMonth()+1}/${x.getDate()}(${WD[x.getDay()]})`; }
/* 울린 지 1분이 지난 한 번 알람은 끄기. 바뀐 게 있으면 true */
function expireOnce(){
  let changed = false; const lim = Date.now() - 60000;
  (S.onceAlarms || []).forEach(x => {
    if (isWeekly(x)) return;
    if (x.on && !x.at){ arm(x); changed = true; }
    else if (x.on && x.at < lim){ x.on = false; delete x.at; changed = true; }
  });
  return changed;
}
/* ---------- 반복 규칙 알람 그룹 (패턴에 없는 그룹, 방식 = 'repeat') ----------
   규칙 종류 (하나라도 맞으면 그날 울림)
   - after  : prev 근무 다음에 이어지는 target 근무 중 nth번째 날   예) 주간 다음 휴일 중 첫째 날
   - weekday: 고른 요일 (shift 를 고르면 그 근무인 날만)             예) 월요일, 휴일인 토요일
   - shift  : target 근무인 날 전부                                   예) 휴일마다           */
function isRepeat(id){ return isAlarmOnly(id) && !!S.groups[id] && S.groups[id].mode === 'repeat'; }
function isShiftMode(id){ return isAlarmOnly(id) && !!S.groups[id] && S.groups[id].mode === 'shift'; }
/* 알람 전용 그룹이 이 날 울리는지 */
function groupMatches(id, date){
  const g = S.groups[id];
  if (isShiftMode(id)) return (g.shifts||[]).some(x => hasShift(date, x));
  if (isRepeat(id)) return (g.rules||[]).some(r => ruleMatch(r, date));
  return false;
}
function hasShift(date, id){ return shiftsOn(date).includes(id); }
function ruleMatch(r, date){
  if (r.kind === 'weekday') return (r.days||[]).includes(parseYmd(date).getDay()) && (!r.shift || hasShift(date, r.shift));
  if (r.kind === 'shift') return !!r.target && hasShift(date, r.target);
  if (r.kind === 'after'){
    if (!r.target || !hasShift(date, r.target)) return false;
    let pos = 1, d = addDays(date, -1);
    while (pos < 62 && hasShift(d, r.target)){ pos++; d = addDays(d, -1); }
    return !!r.prev && hasShift(d, r.prev) && (r.nth||[]).includes(pos);
  }
  return false;
}
function ruleIdsOn(date){
  return Object.keys(S.groups).filter(id => S.types[id] && S.groups[id].on && groupMatches(id, date));
}
function idsOn(date){ return [...new Set([...shiftsOn(date), ...ruleIdsOn(date)])]; }
const NTH = ['첫째','둘째','셋째','넷째'];
function ruleText(r){
  const nm = id => S.types[id] ? S.types[id].name : '?';
  if (r.kind === 'after') return `${nm(r.prev)} 다음 ${nm(r.target)} 중 ${(r.nth||[]).slice().sort().map(n=>NTH[n-1]).join('·') || '(날 선택 안 함)'} 날`;
  if (r.kind === 'weekday') return `${(r.days||[]).slice().sort().map(d=>WD[d]).join('·') || '(요일 선택 안 함)'}요일${r.shift ? ' 중 '+nm(r.shift)+'인 날' : ''}`;
  return `${nm(r.target)}인 날마다`;
}
/* 짧은 설명: '주간 후 첫 휴일마다', '월·수요일마다' */
function ruleShort(r){
  const nm = id => S.types[id] ? S.types[id].name : '?';
  if (r.kind === 'after'){
    const n = (r.nth||[]).slice().sort();
    if (!n.length) return '';
    const ord = n.length === 1 && n[0] === 1 ? '첫' : n.map(x => NTH[x-1]).join('·');
    return `${nm(r.prev)} 후 ${ord} ${nm(r.target)}마다`;
  }
  if (r.kind === 'weekday'){
    const d = [1,2,3,4,5,6,0].filter(x => (r.days||[]).includes(x));
    if (!d.length) return '';
    return `${r.shift ? nm(r.shift) + '인 ' : ''}${d.map(x => WD[x]).join('·')}요일마다`;
  }
  return r.target ? `${nm(r.target)}마다` : '';
}
function modeText(id){
  const g = S.groups[id];
  if (!isAlarmOnly(id)) return `${S.types[id].name} 근무마다`;
  if (isRepeat(id)){ const t = (g.rules||[]).map(ruleShort).filter(Boolean); return t.length ? t.join(', ') : '규칙을 정해 주세요'; }
  const sh = (g.shifts||[]).filter(x => S.types[x]);
  return sh.length ? sh.map(x => S.types[x].name).join('·') + ' 근무마다' : '근무를 골라 주세요';
}
function nextRuleDays(id, n){
  const out = [], today = todayStr(), g = S.groups[id];
  for (let k=0; k<90 && out.length<n; k++){ const d = addDays(today, k); if (groupMatches(id, d)) out.push(d); }
  return out;
}
function defaultRule(kind){
  const uniq = [...new Set(S.pattern)].filter(x => S.types[x]);
  const work = uniq.find(x => !S.types[x].off) || uniq[0], off = uniq.find(x => S.types[x].off) || uniq[0];
  if (kind === 'weekday') return {kind, days:[1], shift:''};
  if (kind === 'shift') return {kind, target: off};
  return {kind:'after', prev: work, target: off, nth:[1]};
}

/* 앞으로 days일 동안 울릴 알람 전체 (같은 시각은 하나로 합침) */
function alarmEntries(days){
  if (!S.enabled) return [];
  const map = {}, from = Date.now() - 60000, today = todayStr();
  const add = (at, time, ids, labels) => { const e = map[at] || (map[at] = {at, time, ids:[], labels:[]});
    ids.forEach(id => { if (!e.ids.includes(id)) e.ids.push(id); }); (labels||[]).forEach(l => e.labels.push(l)); };
  for (let k=0; k<days; k++){
    const date = addDays(today, k);
    alarmsFor(idsOn(date)).forEach(a => { const at = atOf(date, a.time); if (at > from) add(at, a.time, a.ids); });
    const wd = parseYmd(date).getDay();
    (S.onceAlarms || []).filter(x => x.on && isWeekly(x) && x.days.includes(wd))
      .forEach(x => { const at = atOf(date, x.t); if (at > from) add(at, x.t, [], [x.label || '알람']); });
  }
  oneShots().forEach(o => { if (o.at > from) add(o.at, o.time, o.ids, o.labels); });
  return Object.values(map).sort((a,b) => a.at - b.at);
}
function upcoming(limit=5){
  const now = Date.now();
  return alarmEntries(10).filter(e => e.at > now).slice(0, limit).map(e => ({date: ymd(new Date(e.at)), time:e.time, ids:e.ids, labels:e.labels||[]}));
}
/* 알람 이름들: 그룹 이름 + 일회성 알람 이름 */
function entryNames(e){ return [...(e.ids||[]).filter(id => S.types[id]).map(id => S.types[id].name), ...(e.labels||[])]; }
function untilText(date, time){
  const [h,m] = time.split(':').map(Number); const d = parseYmd(date); d.setHours(h, m, 0, 0);
  let mins = Math.round((d - new Date())/60000); if (mins < 1) return '곧';
  const dd = Math.floor(mins/1440), hh = Math.floor((mins%1440)/60), mm = mins%60;
  return (dd? dd+'일 ':'') + (hh? hh+'시간 ':'') + mm + '분 후';
}
function dayWord(date){ const k = diffDays(todayStr(), date); return k===0?'오늘':k===1?'내일':k===2?'모레':fmtDate(date); }

/* ===================== 타입 / 그룹 ===================== */
/* 캘린더에 등록된 근무 목록 (알람 탭에서 만든 '알람 전용 그룹'은 제외) */
function shiftOrder(){ return typeOrder().filter(id => S.types[id] && !S.types[id].alarmOnly); }
function isAlarmOnly(id){ return !!(S.types[id] && S.types[id].alarmOnly); }
function typeOrder(){
  const seen = []; S.pattern.forEach(id => { if (!seen.includes(id)) seen.push(id); });
  Object.keys(S.types).forEach(id => { if (!seen.includes(id)) seen.push(id); });
  const ord = (S.order || []).filter(id => S.types[id]);
  return [...ord, ...seen.filter(id => !ord.includes(id))];
}
function groupOrder(){
  return typeOrder().filter(id => !(S.pattern.includes(id) && S.types[id].off && !(S.groups[id] && S.groups[id].times.length)));
}
function moveType(id, dir){
  const vis = groupOrder(), i = vis.indexOf(id), other = vis[i + dir];
  if (i < 0 || !other) return;
  const list = typeOrder(), a = list.indexOf(id), b = list.indexOf(other);
  [list[a], list[b]] = [list[b], list[a]];
  S.order = list; save();
}
function moveGroup(id, dir){
  const el = document.getElementById('g-'+id), top = el ? el.getBoundingClientRect().top : null;
  moveType(id, dir); render();
  const n = document.getElementById('g-'+id);
  if (n){
    if (top !== null) window.scrollBy(0, n.getBoundingClientRect().top - top); // 옮긴 카드가 손가락 아래 그대로 있게
    n.style.transition = 'none'; n.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => { n.style.transition = 'box-shadow .6s'; n.style.boxShadow = ''; }, 350);
  }
}
function nextColor(){ const used = Object.values(S.types).map(t=>t.color); return PALETTE.find(c=>!used.includes(c)) || PALETTE[Object.keys(S.types).length % PALETTE.length]; }
function ensureGroup(id){ if (!S.groups[id]) S.groups[id] = {on:true, times:[]}; }
function chip(id, mini){
  const t = S.types[id]; if (!t) return '';
  return `<span class="chip ${mini?'mini':''}" style="background:${t.color}">${esc(mini ? t.short : t.name)}</span>`;
}
/* 새 근무(캘린더) 또는 알람 전용 그룹(alarmOnly) 만들기. 같은 이름이 있으면 그것을 씀 */
function addCustomType(name, color, alarmOnly){
  name = name.trim(); if (!name) return null;
  const exist = Object.entries(S.types).find(([,t]) => t.name === name);
  if (exist){
    const [id, t] = exist;
    if (!alarmOnly && t.alarmOnly){
      // 알람 탭에서 만든 같은 이름의 그룹 → 캘린더 근무로 바꿈
      t.alarmOnly = false; ensureGroup(id);
      const g = S.groups[id]; if (g.mode !== 'repeat'){ g.mode = 'shift'; g.shifts = [...new Set([...(g.shifts||[]), id])]; }
    }
    return id;
  }
  let id = 'c' + Date.now().toString(36);
  while (S.types[id]) id += Math.floor(Math.random()*10);
  S.types[id] = {name, short:name[0], color: color || nextColor(), off:false};
  if (alarmOnly) S.types[id].alarmOnly = true;
  ensureGroup(id); S.groups[id].mode = 'shift'; S.groups[id].shifts = alarmOnly ? [] : [id];
  return id;
}

/* ---------- 초기 설정 ---------- */
function stepCount(){ return NATIVE ? 5 : 4; }
function stepsBar(){ return `<div class="steps">${Array.from({length: stepCount()}, (_, k) => k + 1).map(i=>`<i class="${i<=W.step?'on':''}"></i>`).join('')}</div>`; }

function parsePattern(text){ return [...text.replace(/\s|,|\/|-/g,'')]; }
function patternPreview(text){
  const chars = parsePattern(text);
  if (!chars.length) return '<p class="muted small">입력하면 미리보기가 나타납니다.</p>';
  const cells = chars.map((c,i) => {
    const color = (S.types[c] && S.types[c].color) || DEFAULT_COLORS[c] || '#64748b';
    return `<div class="cell-p"><span class="chip" style="background:${color}">${esc(c)}</span>${i+1}</div>`;
  }).join('');
  const uniq = [...new Set(chars)];
  const names = uniq.map(c => {
    const nm = (S.types[c] && S.types[c].name) || DEFAULT_NAMES[c] || (c+'근무');
    const isNew = !DEFAULT_NAMES[c] && !S.types[c];
    return `<b>${esc(c)}</b>=${esc(nm)}${isNew?' <span class="muted">(새 유형)</span>':''}`;
  }).join(' · ');
  return `<div class="preview">${cells}</div><p class="small">주기 <b>${chars.length}일</b> · ${names}</p>`;
}

/* ---------- 캘린더 ---------- */
function calHTML(y, m, interactive){
  const first = new Date(y, m, 1), dim = new Date(y, m+1, 0).getDate();
  const weeks = Math.ceil((first.getDay() + dim) / 7), today = todayStr();
  let h = `<div class="cal-head"><button class="icon" data-a="calPrev">‹</button>
    <b data-a="calToday" style="cursor:pointer">${y}년 ${m+1}월</b><button class="icon" data-a="calNext">›</button></div>
    <div class="cal-grid">${WD.map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}`;
  for (let i=0; i<weeks*7; i++){
    const d = new Date(y, m, 1 - first.getDay() + i), ds = ymd(d), wd = d.getDay();
    h += `<div class="cell ${d.getMonth()!==m?'other':''} ${ds===today?'today':''} ${S.overrides[ds]?'edited':''}" ${interactive?`data-a="day" data-d="${ds}"`:''}>
      <span class="dn ${wd===0?'sun':wd===6?'sat':''}">${d.getDate()}</span>
      <div class="chips">${shiftsOn(ds).map(id=>chip(id,true)).join('')}</div>
      ${onceOn(ds).slice(0,2).map(x => `<div class="rule-mini once-mini">⏰${x.t.replace(/^0/,'')}</div>`).join('')}
      ${ruleIdsOn(ds).filter(id => isRepeat(id) && S.groups[id].times.some(t=>t.on)).map(id => `<div class="rule-mini" style="color:${S.types[id].color}">⏰${esc(S.types[id].short)}</div>`).join('')}
      ${S.memos[ds] ? `<div class="memo-mini">${esc(S.memos[ds].split('\n')[0])}</div>` : ''}</div>`;
  }
  h += `</div><div class="legend">${shiftOrder().map(id=>`<span class="row small" style="gap:4px">${chip(id)}</span>`).join('')}
    ${interactive?'<span class="small muted" style="margin-left:auto">● 변경된 날</span>':''}</div>`;
  return h;
}

/* ---------- 알람 그룹 편집 ---------- */
function groupsHTML(full){
  const list = groupOrder();
  return list.map((id, idx) => {
    const t = S.types[id]; ensureGroup(id); const g = S.groups[id];
    const inPattern = S.pattern.includes(id);
    const once = isOnce(id), repeat = isRepeat(id), shiftMode = isShiftMode(id), alarmOnly = isAlarmOnly(id);
    const times = g.times.length ? g.times.map((x,i)=>`
      <div class="time-row ${x.on&&g.on?'':'off'}">
        ${tfHTML(x.t, `data-c="time" data-id="${id}" data-i="${i}" readonly`)}
        <button class="edit-btn" data-a="dtOpen" data-k="g" data-id="${id}" data-i="${i}" aria-label="알람 수정">수정</button>
        ${once ? `<span class="small ${x.on&&g.on&&x.at?'':'muted'}" style="flex:none;${x.on&&g.on&&x.at?'color:var(--accent);font-weight:700':''}">${x.on&&g.on&&x.at ? dayWord(ymd(new Date(x.at)))+' 울림' : '꺼짐'}</span>` : ''}
        <label class="switch"><input type="checkbox" ${x.on?'checked':''} data-c="tOn" data-id="${id}" data-i="${i}"><span></span></label>
        <button class="del" data-a="tDel" data-id="${id}" data-i="${i}" aria-label="삭제">✕</button>
      </div>`).join('') : `<div class="empty">${t.off?'휴무일 — 알람 없음 (필요하면 추가)':'알람이 없습니다. 시간을 추가하세요.'}</div>`;
    const onCount = g.times.filter(x=>x.on).length;
    const status = onCount ? `<span class="badge ${g.on?'':'off'}">${onCount}개</span>` : `<span class="badge ${g.on?'none':'off'}">알람 없음</span>`;
    const arrows = `<button class="mv" data-a="mvUp" data-id="${id}" ${idx===0?'disabled':''} aria-label="위로">▲</button>
          <button class="mv" data-a="mvDown" data-id="${id}" ${idx===list.length-1?'disabled':''} aria-label="아래로">▼</button>`;
    const headRow = `<div class="row g-head ${g.on?'':'g-off'}" style="gap:6px">
      <button class="g-row" data-a="gOpen" data-id="${id}" style="flex:0 1 auto;min-width:0">
        <span class="dot" style="background:${t.color};width:14px;height:14px"></span>
        <span class="g-name">${esc(t.name)}</span></button>
      <label class="switch sm" title="그룹 전체 켜기/끄기"><input type="checkbox" ${g.on?'checked':''} data-c="gOn" data-id="${id}" aria-label="${esc(t.name)} 알람 전체 켜기"><span></span></label>
      <button class="g-row" data-a="gOpen" data-id="${id}" style="flex:1;justify-content:flex-end;gap:6px">${status}
        <span class="chev">${openGroup===id?'⌃':'›'}</span></button>
      ${arrows}</div>`;
    // 알람 탭: 접힌 상태면 이름과 알람 개수만
    if (full && openGroup !== id){
      return `<div class="card group-card ${flashGroup===id?'flash':''}" id="g-${id}" style="padding:4px 14px">${headRow}</div>`;
    }
    // 펼친 상태: 울리는 방식 한 줄 + 시간 목록. 시간 옆 '수정'을 누르면 상세 화면
    const modeLine = `<button class="g-modeline" data-a="dtGroup" data-id="${id}">${full ? '' : `<span class="dot" style="background:${t.color}"></span><b>${esc(t.name)}</b>`}
        <span class="g-mode">🔁 ${esc(modeText(id))}</span><span class="chev" style="margin-left:auto">›</span></button>`;
    return `<div class="card group-card ${flashGroup===id?'flash':''}" id="g-${id}" ${full?'style="padding:4px 14px 14px"':''}>
      ${full ? headRow + '<div style="border-top:1px solid var(--line);margin:4px 0 8px"></div>' : ''}
      ${modeLine}
      ${times}
      ${addingTime===id ? `<div class="time-row add-row">
        ${tfHTML('', 'id="newTime"', '5:30')}
        <button class="small-btn" data-a="tAddOk" data-id="${id}" style="padding:9px 14px">추가</button>
        <button class="del" data-a="tAddCancel" aria-label="취소">✕</button></div>` : ''}
      <div class="row between" style="margin-top:8px">
        ${addingTime===id ? '<span></span>' : `<button class="small-btn" data-a="tAdd" data-id="${id}">+ 알람 시간 추가</button>`}
        <div class="row" style="gap:6px">
          ${g.times.length || isAlarmOnly(id) ? `<button class="link" style="color:var(--danger)" data-a="gDelAll" data-id="${id}">그룹 전체 삭제</button>` : ''}
          ${full ? '' : arrows}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* '특정 근무마다': 캘린더에 등록된 근무 중에서 고르기 */
function shiftPickHTML(id){
  const g = S.groups[id], sel = g.shifts || [];

    <div class="small muted">어떤 근무가 있는 날 울릴까요? (여러 개 선택 가능)</div>
    <div class="sel-grid" style="margin:2px 0 0">${shiftOrder().map(x => { const t = S.types[x], on = sel.includes(x);
      return `<button class="${on?'on':''}" style="${on?`background:${t.color};border-color:${t.color}`:''}" data-a="gShift" data-id="${id}" data-s="${x}">

/* 반복 규칙 편집 */
function rulesHTML(id){
  const g = S.groups[id], rules = g.rules || [];
  const types = shiftOrder().filter(x => x !== id);
  const opts = (sel, any) => (any ? `<option value="" ${!sel?'selected':''}>근무 상관없이</option>` : '')
    + types.map(x => `<option value="${x}" ${x===sel?'selected':''}>${esc(S.types[x].name)}</option>`).join('');
  const rows = rules.map((r, i) => {
    let body = '';
    if (r.kind === 'after') body = `
      <div class="rule-line"><select class="snd-sel" data-c="rPrev" data-id="${id}" data-r="${i}">${opts(r.prev)}</select><span>다음에 오는</span>
        <select class="snd-sel" data-c="rTarget" data-id="${id}" data-r="${i}">${opts(r.target)}</select><span>중</span></div>
      <div class="pills">${[1,2,3,4].map(n => `<button class="${(r.nth||[]).includes(n)?'on':''}" data-a="rNth" data-id="${id}" data-r="${i}" data-n="${n}">${NTH[n-1]} 날</button>`).join('')}</div>`;
    else if (r.kind === 'weekday') body = `
      <div class="pills">${[1,2,3,4,5,6,0].map(d => `<button class="${(r.days||[]).includes(d)?'on':''} ${d===0?'sun':d===6?'sat':''}" data-a="rDay" data-id="${id}" data-r="${i}" data-d="${d}">${WD[d]}</button>`).join('')}</div>
      <div class="rule-line"><span>근무 조건</span><select class="snd-sel" data-c="rShift" data-id="${id}" data-r="${i}">${opts(r.shift, true)}</select></div>`;
    else body = `<div class="rule-line"><select class="snd-sel" data-c="rTarget" data-id="${id}" data-r="${i}">${opts(r.target)}</select><span>인 날마다</span></div>`;
    return `<div class="rule"><div class="row between"><b class="small">${esc(ruleText(r))}</b>
      <button class="del" data-a="rDel" data-id="${id}" data-r="${i}" aria-label="규칙 삭제">✕</button></div>${body}</div>`;
  }).join('');
  const next = nextRuleDays(id, 6);
  return `<div class="rules">
    ${rows || '<div class="empty">규칙이 없어요. 아래에서 추가하세요.</div>'}
    <div class="row wrap" style="gap:6px;margin-top:8px">
      <button class="small-btn" data-a="rAdd" data-id="${id}" data-k="after">+ 근무 순서</button>
      <button class="small-btn" data-a="rAdd" data-id="${id}" data-k="weekday">+ 요일</button>
    </div>
    <div class="small" style="margin-top:10px;color:var(--muted)">${rules.length ? (next.length ? '다음에 울릴 날: <b style="color:var(--ink)">' + next.map(d => { const x = parseYmd(d); return `${x.getMonth()+1}/${x.getDate()}(${WD[x.getDay()]})`; }).join(', ') + '</b>' : '앞으로 90일 동안 해당하는 날이 없어요.') : ''}</div>
  </div>`;
}

/* ---------- 메인 ---------- */
function nativePerms(){ let p = {}; try{ p = JSON.parse(NATIVE.permStatus()); }catch(e){} return p; }
function permBanner(){
  if (!NATIVE) return '';
  // 꼭 필요한 것만 안내: 알림, 정확한 알람, 잠금 화면에 띄우기('다른 앱 위에 표시' 또는 '잠금 화면 알람' 중 하나면 충분)

/* ===================== 날짜 편집 모달 ===================== */
function openDay(date){ D = {date, sel:[...shiftsOn(date)], newName:'', newColor:nextColor(), adding:false, activate:[], memo:S.memos[date]||''}; renderDay(); }
/* 그룹이 꺼져 있거나 켜진 시간이 없으면 '활성화'가 필요 */
/* 이 날에 근무를 추가. 이미 다른 근무가 있으면 일단 함께 넣고, 기존 근무를 남길지 물어봄 */
/* '지원으로' / '주간으로' / '야간으로' — 받침에 맞는 조사 */
function ro(word){
  const c = word.charCodeAt(word.length-1) - 0xAC00;
  if (c < 0 || c > 11171) return '(으)로';
  const jong = c % 28;
  return (jong === 0 || jong === 8) ? '로' : '으로';
}
function addShift(id){
  if (D.sel.includes(id)) return;
  const prev = D.sel.slice();
  D.sel.push(id);
  D.keepAsk = prev.length ? {id, prev, replace: true} : null;   // 기본: 기존 근무 지우고 바꾸기
}
/* 저장 직전: '바꾸기'를 골라 둔 상태면 기존 근무를 빼기 */
function applyKeepChoice(){
  const k = D.keepAsk;
  if (k && k.replace && D.sel.includes(k.id)){
    D.sel = D.sel.filter(x => !k.prev.includes(x));
    D.activate = D.activate.filter(x => D.sel.includes(x));
  }
  D.keepAsk = null;
}
function needsActivate(id){ const g = S.groups[id]; return !!g && g.times.length > 0 && (!g.on || !g.times.some(t=>t.on)); }
function activateGroup(id){ const g = S.groups[id]; if (!g) return; g.on = true; if (!g.times.some(t=>t.on)) g.times.forEach(t=>t.on=true); }
function groupSummary(id){
  const g = S.groups[id]; if (!g || !g.times.length) return '알람 시간 없음';
  const on = g.times.filter(t=>t.on), list = (on.length ? on : g.times).map(t=>t.t);
  return list.slice(0,3).join(', ') + (list.length>3 ? ` 외 ${list.length-3}개` : '');
}
function previewAlarms(){
  const saved = {}; D.activate.forEach(id => { saved[id] = JSON.stringify(S.groups[id]); activateGroup(id); });
  const k = D.keepAsk, sel = k && k.replace && D.sel.includes(k.id) ? D.sel.filter(x => !k.prev.includes(x)) : D.sel;
  const r = alarmsFor([...new Set([...sel, ...ruleIdsOn(D.date)])]);
  onceOn(D.date).forEach(x => { if (!r.some(a => a.time === x.t)) r.push({time: x.t, ids: []}); });
  r.sort((a, b) => a.time.localeCompare(b.time));
  Object.keys(saved).forEach(id => { S.groups[id] = JSON.parse(saved[id]); });
  return r;
}

function deleteType(id){
  delete S.types[id]; delete S.groups[id];

  Object.values(S.groups).forEach(g => { if (g.shifts) g.shifts = g.shifts.filter(x => x !== id); });

/* ===================== 알람 엔진 ===================== */
let audioCtx = null, ringTimer = null, ringStop = null, ringInfo = null;
function ensureAudio(){
  try{ if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       if (audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){}
}
/* ---------- 알람 소리 (WebAudio로 합성, 파일 불필요) ---------- */
function tone(freq, at, dur, type='sine', vol=.25, opt={}){
  const t0 = audioCtx.currentTime + at, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if (opt.to) osc.frequency.linearRampToValueAtTime(opt.to, t0 + dur * (opt.mid ? .5 : 1));
  if (opt.mid) osc.frequency.linearRampToValueAtTime(freq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + (opt.attack || .015));
  if (opt.hold) g.gain.setValueAtTime(vol, t0 + dur - .03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination); osc.start(t0); osc.stop(t0 + dur + .05);
}
const SOUNDS = {
  beep:    {name:'기본 삐삐',      period:1300, play(){ tone(880,0,.18,'square'); tone(880,.22,.18,'square'); tone(1046,.44,.18,'square'); }},
  digital: {name:'디지털 시계',    period:1000, play(){ [0,.12,.24,.36].forEach(o=>tone(2000,o,.07,'square',.18,{hold:true})); }},
  chime:   {name:'차임 (딩동)',    period:2200, play(){ tone(659,0,1.1,'sine',.35); tone(523,.55,1.4,'sine',.35); }},
  bell:    {name:'벨',             period:1600, play(){ [0,.4].forEach(o=>{ tone(1318,o,1.1,'sine',.3); tone(2637,o,.6,'sine',.08); tone(659,o,1.2,'triangle',.12); }); }},
  melody:  {name:'부드러운 멜로디', period:2400, play(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.22,.5,'triangle',.3)); }},
  rooster: {name:'점점 커지는 소리', period:1300, play(){ const v = Math.min(.35, .05 + ringCount*.03); tone(740,0,.25,'sine',v); tone(988,.3,.25,'sine',v); }},
  siren:   {name:'사이렌',         period:1600, play(){ tone(600,0,1.5,'sawtooth',.16,{to:1200,mid:true,hold:true}); }},
  alert:   {name:'강한 경보',      period:900,  play(){ [0,.15,.3,.45].forEach(o=>tone(1400,o,.1,'sawtooth',.22,{hold:true})); }},
  system:  {name:'휴대폰 기본 알람음', period:1300, nativeOnly:true, play(){ SOUNDS.beep.play(); }},
};
let ringCount = 0;
function soundOf(ids){
  const g = (ids||[]).map(id => S.groups[id]).find(g => g && g.sound && SOUNDS[g.sound]);
  return g ? g.sound : (SOUNDS[S.sound] ? S.sound : 'beep');
}
function playSound(key){ ensureAudio(); if (!audioCtx) return; try{ (SOUNDS[key]||SOUNDS.beep).play(); }catch(e){} }
let previewTimer = null;
function previewSound(key){ if (NATIVE){ try{ NATIVE.preview(key); }catch(e){} return; } clearTimeout(previewTimer); ringCount = 3; playSound(key); }
function soundOptions(sel, withDefault){
  return (withDefault ? `<option value="" ${!sel?'selected':''}>기본 소리 (${esc(SOUNDS[S.sound]?.name||'')})</option>` : '') +
    Object.entries(SOUNDS).filter(([,v]) => NATIVE || !v.nativeOnly).map(([k,v]) => `<option value="${k}" ${sel===k?'selected':''}>${v.name}</option>`).join('');
}
function startRing(time, ids, isTest, extra){
  stopRing(true); ensureAudio();
  extra = extra || [];
  ringInfo = {time, ids, extra};
  const labels = ids.map(id => S.types[id] ? chip(id) : '').join('') + extra.map(l => `<span class="chip" style="background:#64748b">${esc(l)}</span>`).join('');
  $('#ring').classList.remove('hidden');
  $('#ring').innerHTML = `<div class="small" style="opacity:.7">${isTest?'알람 테스트':fmtDate(todayStr())}</div>
    <div class="rt">${fmt12(time) || time}</div><div class="labels">${labels}</div><div style="height:20px"></div>
    <button class="stop" data-a="ringStop">끄기</button><button class="snooze" data-a="ringSnooze">5분 후 다시 알림</button>`;
  const snd = SOUNDS[soundOf(ids)]; ringCount = 0;
  const go = () => { ringCount++; playSound(soundOf(ids)); try{ navigator.vibrate && navigator.vibrate([400,200,400]); }catch(e){} };
  go(); ringTimer = setInterval(go, snd.period);
  // 자동으로 멈추지 않음: 사용자가 '끄기' 또는 '5분 후 다시 알림'을 누를 때까지 계속 울림
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('⏰ ' + time + ' 알람', {body: [...ids.map(id=>S.types[id]?.name || id), ...extra].join(', '), requireInteraction:true}); }catch(e){}
  }
}
function stopRing(silent){
  clearInterval(ringTimer); clearTimeout(ringStop); ringTimer = ringStop = null;
  $('#ring').classList.add('hidden'); $('#ring').innerHTML = '';
  try{ navigator.vibrate && navigator.vibrate(0); }catch(e){}
}
let lastMinute = '';
function tick(){
  const n = new Date(), key = ymd(n) + ' ' + hm(n);
  if (key === lastMinute) return; lastMinute = key;
  updateLive();
  if (S.setupDone && expireOnce()){ save(); if (tab === 'alarm' && !document.activeElement?.matches('input')) render(); }
  if (!S.setupDone || !S.enabled || NATIVE) return;
  if (S.lastFired === key) return;
  const t = hm(n), hits = alarmEntries(2).find(e => ymd(new Date(e.at)) + ' ' + e.time === key);
  const snz = S.snoozes.filter(s => s.at === key);
  S.snoozes = S.snoozes.filter(s => s.at > key);
  if (hits || snz.length){
    const ids = [...new Set([...(hits ? hits.ids : []), ...snz.flatMap(s => s.ids)])];
    const extra = [...(hits ? hits.labels || [] : []), ...snz.flatMap(s => s.labels || [])];
    S.lastFired = key; save();
    startRing(t, ids, false, extra);
  } else save();
}
setInterval(tick, 1000);

document.addEventListener('visibilitychange', () => { if (!document.hidden){ lastMinute=''; tick(); if (NATIVE){ scheduleNative(); if ((S.setupDone && tab!=='alarm') || (!S.setupDone && W.step === 5)) render(); } } });

  rAdd(el){ const g = S.groups[el.dataset.id]; (g.rules = g.rules || []).push(defaultRule(el.dataset.k)); save(); render(); },

/* ---------- 시각: 숫자 + 오전/오후 (저장은 24시간 'HH:MM') ---------- */
function to12(t){ const [h, m] = t.split(':').map(Number); return {h: (h % 12) || 12, m, pm: h >= 12}; }
function fmt12(t){ if (!t) return ''; const x = to12(t); return `${x.pm ? '오후' : '오전'} ${x.h}:${pad(x.m)}`; }
/* 숫자 입력 칸 + 오전/오후 버튼 */
function tfHTML(t, attrs, ph){
  const x = t ? to12(t) : {h:'', m:0, pm:false};
  return `<span class="tf"><input class="tin" type="text" inputmode="numeric" maxlength="5" value="${t ? x.h + ':' + pad(x.m) : ''}" ${ph ? `placeholder="${ph}"` : ''} ${attrs} aria-label="알람 시각">
    <span class="ampm"><button type="button" class="${x.pm ? '' : 'on'}" data-a="ap" data-v="am">오전</button><button type="button" class="${x.pm ? 'on' : ''}" data-a="ap" data-v="pm">오후</button></span></span>`;
}
/* '530'+오전 → 05:30, '530'+오후 → 17:30, '1200'+오전 → 00:00, '17'(13~23시는 그대로) → 17:00. 잘못되면 '' */
function parse12(v, pm){
  const d = String(v || '').replace(/\D/g, '');
  if (!d) return '';
  let h, m;
  if (d.length <= 2){ h = +d; m = 0; }
  else if (d.length === 3){ h = +d.slice(0,1); m = +d.slice(1); }
  else { h = +d.slice(0,2); m = +d.slice(2,4); }
  if (h > 23 || m > 59) return '';
  if (h >= 1 && h <= 12) h = (h % 12) + (pm ? 12 : 0);   // 13~23 또는 0 은 입력한 그대로
  return pad(h) + ':' + pad(m);
}
/* 입력 칸 옆의 오전/오후 상태로 24시간 값 읽기 */
function tfValue(input){
  if (!input) return '';
  const w = input.closest('.tf'), pm = !!(w && w.querySelector('[data-v=pm].on'));
  return parse12(input.value, pm);
}

  const d = el.value.replace(/\D/g, '').slice(0, 4);
  el.value = d.length === 3 ? d[0] + ':' + d.slice(1) : d.length === 4 ? d.slice(0,2) + ':' + d.slice(2) : d;
});

    x.t = v; x.on = true; arm(x); S.onceAlarms.sort((a,b) => a.t.localeCompare(b.t));
    toast(`${dayWord(ymd(new Date(x.at)))} ${fmt12(x.t)}에 울립니다`);
  }
  else if (c === 'oOn'){ const x = S.onceAlarms[+el.dataset.i]; x.on = el.checked; arm(x);
    if (x.on && !isWeekly(x) && x.at < Date.now()){ delete x.date; arm(x); }   // 지난 날짜면 가장 가까운 시각으로
    if (x.on) toast(`${onceWhen(x).replace(' 울림','')} ${fmt12(x.t)}에 울립니다`); }

/* 시작 */
if (!S.setupDone && S.pattern.length) W.text = S.pattern.join('');
/* 안드로이드: 앱으로 돌아올 때(설정 화면에서 권한을 바꾸고 온 경우 등) 화면 새로 그리기 */
window.onAppResume = function(){
  if (!S.setupDone) return;
  scheduleNative();
  if (!document.activeElement || !document.activeElement.matches('input, textarea')) render();
};

/* 안드로이드 뒤로가기: 창 닫기 → 캘린더 탭 → 앱 나가기 */
window.handleBack = function(){
  if (!$('#ring').classList.contains('hidden')){ stopRing(); return true; }
  if (!$('#modal').classList.contains('hidden')){ pendingConfirm = null; closeModal(); return true; }
  if (S.setupDone && tab !== 'cal'){ tab = 'cal'; render(); return true; }
  if (!S.setupDone && W.step > 1){ W.step--; render(); return true; }
  return false;
};
/* ---------- 앱 안에서 업데이트 ---------- */
let updState = null; // null | {state:'download', pct} | {state:'confirm'} | {state:'error', msg}
function curVersion(){ try{ return (NATIVE && NATIVE.appVersion && NATIVE.appVersion()) || ''; }catch(e){ return ''; } }
function verCmp(a, b){
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i=0; i<Math.max(x.length, y.length); i++){ const d = (x[i]||0) - (y[i]||0); if (d) return d; }
  return 0;
}
function hasUpdate(){ return !!(S.update && curVersion() && verCmp(S.update.ver, curVersion()) > 0); }
/* GitHub 최신 릴리스 확인. 결과: 'new' | 'none' | 'fail' | 'skip' */
async function checkUpdate(force){
  if (!NATIVE || !NATIVE.update || !UPDATE_REPO) return 'skip';
  if (!force && S.updCheckedAt && Date.now() - S.updCheckedAt < 6 * 3600e3) return hasUpdate() ? 'new' : 'skip';
  try{
    const r = await fetch('https://api.github.com/repos/' + UPDATE_REPO + '/releases/latest', {headers:{Accept:'application/vnd.github+json'}});
    if (!r.ok) return 'fail';
    const j = await r.json();
    const apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
    const m = apk && apk.name.match(/(\d+\.\d+\.\d+)/);
    S.updCheckedAt = Date.now();
    S.update = m ? {ver: m[1], url: apk.browser_download_url, title: j.name || j.tag_name || '', size: apk.size || 0} : null;
    save();
    return hasUpdate() ? 'new' : 'none';
  }catch(e){ return 'fail'; }
}
function updateBanner(){
  if (!hasUpdate()) return '';
  const u = S.update, st = updState;
  let right = '<button class="small-btn" data-a="doUpdate">업데이트</button>', sub = '버튼을 누른 뒤 설치 화면에서 <b>업데이트</b>만 누르면 돼요. 설정과 알람은 그대로 남아요.';
  if (st && st.state === 'download'){ right = `<span class="badge">${st.pct}%</span>`; sub = `내려받는 중이에요 <span class="upd-bar"><i style="width:${st.pct}%"></i></span>`; }
  else if (st && st.state === 'confirm'){ right = ''; sub = '설치 화면에서 <b>업데이트</b>를 눌러 주세요. 설치가 끝나면 앱을 다시 열면 돼요.'; }
  else if (st && st.state === 'needPermission'){ sub = '설정 화면에서 <b>이 출처 허용</b>을 켜고 돌아와서 다시 <b>업데이트</b>를 눌러 주세요.'; }
  else if (st && st.state === 'error'){ right = '<button class="small-btn" data-a="doUpdate">다시 시도</button>'; sub = esc(st.msg); }
  return `<div class="upd-banner"><div style="flex:1"><b>새 버전 ${esc(u.ver)}이(가) 나왔어요</b><div class="small" style="margin-top:2px">${sub}</div></div>${right}</div>`;
}
function startUpdate(){
  if (!hasUpdate()) return;
  updState = {state:'download', pct:0};
  if (tab !== 'cal'){ tab = 'cal'; }
  render();
  try{ NATIVE.update(S.update.url); }catch(e){ updState = {state:'error', msg:'업데이트를 시작하지 못했어요'}; render(); }
}
/* 안드로이드 쪽에서 진행 상황을 알려 줌 */
window.onUpdateState = function(state, value){
  if (state === 'download') updState = {state, pct: +value || 0};
  else if (state === 'error') updState = {state, msg: value};
  else updState = {state};
  if (state === 'needPermission') toast("'이 출처 허용'을 켜 주세요");
  if (S.setupDone && tab === 'cal' && $('#modal').classList.contains('hidden')){
    const old = document.querySelector('.upd-banner'), html = updateBanner();
    if (old && html){ old.outerHTML = html; } else render();
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(false).then(r => { if (r === 'new' && S.setupDone && tab === 'cal' && !document.querySelector('.upd-banner')) render(); }); });

/* ---------- 익명 사용 통계 (하루 한 번) ---------- */
function deviceId(){
  if (!S.clientId){
    const a = new Uint8Array(16); crypto.getRandomValues(a);
    S.clientId = Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
    save();
  }
  return S.clientId;
}
function sendStats(){
  if (!STATS_URL || S.statsOn === false || !S.setupDone) return;
  const today = todayStr();
  if (S.statsDay === today) return;
  const custom = Object.keys(S.types).filter(id => !S.pattern.includes(id));
  const ua = navigator.userAgent.match(/Android\s([\d.]+)/);
  let app = 'web'; try{ if (NATIVE && NATIVE.appVersion) app = NATIVE.appVersion(); }catch(e){}
  const body = {
    id: deviceId(), day: today, app, platform: NATIVE ? 'android' : 'web',
    os: ua ? 'Android ' + ua[1].split('.')[0] : '',
    pattern: S.pattern.map(id => S.types[id] ? S.types[id].short : '?').join(''),
    patternLen: S.pattern.length,
    groups: Object.keys(S.groups).filter(id => S.types[id] && S.groups[id].on && S.groups[id].times.some(t => t.on)).length,
    customGroups: custom.filter(id => !isOnce(id) && !isRepeat(id)).length,
    repeatGroups: custom.filter(id => isRepeat(id)).length,
    onceGroups: (S.onceAlarms || []).length,
    overrides: Object.keys(S.overrides).length,
    memos: Object.keys(S.memos || {}).length,
    sound: S.sound, enabled: S.enabled ? 1 : 0,
  };
  // 응답은 읽지 않으므로 no-cors (앱 안의 file:// 화면에서도 보낼 수 있음)
  fetch(STATS_URL, {method:'POST', mode:'no-cors', keepalive:true, body: JSON.stringify(body)})
    .then(() => { S.statsDay = today; try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} })
    .catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(sendStats, 1500); });

scheduleNative(); render(); tick(); setTimeout(sendStats, 1500);
checkUpdate(false).then(r => { if (r === 'new' && S.setupDone && tab === 'cal') render(); });
</script>
</body>
</html>
